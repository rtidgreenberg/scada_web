[pytest]
# Markers
markers =
    pipeline: tests requiring the full sim → selector → scada_web pipeline

# Default: run only unit/fast tests (skip pipeline tests unless explicitly requested)
# To run pipeline tests: pytest -m pipeline
# To run everything:     pytest -m ""
addopts = -m "not pipeline" --tb=short -q

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# scada_web configuration
#
# Declares DDS participants and topic subscriptions for the pre-selector PoC.
# Target topology moves this gateway to domain 1 and selected topics only.
# Pattern: references/act-sim-scope-infra/router/config/control-platform.yaml

# --- XML type library ---
# Generated with: rtiddsgen -convertToXml dds/idl/PlcValue.idl -d dds/idl/
types:
  xml: dds/idl/PlcValue.xml

# --- QoS profiles ---
# Shared profiles grouped by DDS domain: field and presentation.
qos_profiles: dds/qos/profiles.xml

# --- Selection defaults ---
# Initial global minimum separation for web-originated ADD requests. The selector
# also has this value in its own YAML; browser/UI changes override it at runtime
# by sending period_ms/min_separation_ms.
selection:
  default_min_separation_ms: 250

# --- DDS participants ---
# Each participant joins a domain and discovers endpoints on it.
participants:
  plc_domain:
    domain: 0  # same domain as sim/plc_publisher.py

# --- Topic subscriptions ---
# Topic name defaults to type name if type: is omitted.
topics:
  - name: "PLC::MetaData"
    participant: plc_domain
    type: "PLC::MetaData"
    qos_profile: "field::metadata"
    # MetaData is TRANSIENT_LOCAL — we'll receive all tags even as a late joiner.
    #
    # NOTE (DD-028): this subscription is on the HARD REAL-TIME side, which the
    # boundary decision says scada_web must not touch. It stays as-is only because
    # the selector does not exist yet and this keeps the PoC working. When the
    # selector lands, this becomes:
    #     - name: "PLC::SelectedMetaData"
    #       participant: web_domain
    # and scada_web loses its field-side participant entirely. Same for
    # PLC::IdValue → PLC::SelectedValue below.
    #
    # NOTE: metadata streams are TRANSIENT_LOCAL on both field and presentation
    # domains, so late-joining readers receive the latest catalogue sample per uid.
    # Values need no equivalent — they are periodic, so a late joiner waits at
    # most one publish period.

  - name: "PLC::IdValue"
    participant: plc_domain
    type: "PLC::IdValue"
    qos_profile: "field::idvalue"
    # Periodic value stream. No filter — the selector (when built) will
    # pre-filter; for the PoC we receive everything.

# --- Historical view mappings ---
# DD-052/DD-053 supersede config-driven mapping for the typed SCADA gateway.
# View mappings now live in scada_web/views.py. This section remains only as
# legacy PoC input until config.py stops accepting it.
views:
  - name: tag_value
    topic: "PLC::IdValue"
    fields:
      - wire: uid
        view: uid
      - wire: valueTime
        view: timestamp
      - wire: smoothedValue
        view: value
        transform: union_scalar  # resolve Value_t union → bare scalar
      - wire: rawValue
        view: raw_value
        transform: union_scalar

  - name: tag_metadata
    topic: "PLC::MetaData"
    fields:
      - wire: uid
        view: uid
      - wire: longName
        view: name
      - wire: hostname
        view: source
      - wire: limits.redHigh
        view: alarm_hh
        transform: union_scalar
      - wire: limits.redLow
        view: alarm_ll
        transform: union_scalar
      - wire: limits.yellowHigh
        view: alarm_h
        transform: union_scalar
      - wire: limits.yellowLow
        view: alarm_l
        transform: union_scalar

# --- Web server ---
server:
  host: "0.0.0.0"
  port: 8080
  websocket_path: /ws
  rest_prefix: /api/v1

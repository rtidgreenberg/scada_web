# scada_web configuration
#
# Declares DDS participants, topic subscriptions, and view mappings.
# Types are loaded from an XML type library generated from IDL.
# Pattern: references/act-sim-scope-infra/router/config/control-platform.yaml

# --- XML type library ---
# Generated with: rtiddsgen -convertToXml dds/idl/PlcValue.idl -d dds/idl/
types:
  xml: dds/idl/PlcValue.xml

# --- QoS profiles ---
# Shared profiles for sim (writers) and web (readers).
qos_profiles: dds/qos/profiles.xml

# --- DDS participants ---
# Each participant joins a domain and discovers endpoints on it.
participants:
  plc_domain:
    domain: 0  # same domain as sim/plc_publisher.py

# --- Topic subscriptions ---
# Topic name defaults to type name if type: is omitted.
topics:
  - name: "PLC::MetaData"
    participant: plc_domain
    type: "PLC::MetaData"
    qos_profile: "web::metadata"
    # MetaData is TRANSIENT_LOCAL — we'll receive all tags even as a late joiner.
    #
    # NOTE (DD-028): this subscription is on the HARD REAL-TIME side, which the
    # boundary decision says scada_web must not touch. It stays as-is only because
    # the selector does not exist yet and this keeps the PoC working. When the
    # selector lands, this becomes:
    #     - name: "PLC::SelectedMetaData"
    #       participant: web_domain
    # and scada_web loses its field-side participant entirely. Same for
    # PLC::IdValue → PLC::SelectedValue below.
    #
    # NOTE (DD-029): the web side is BEST_EFFORT + VOLATILE, so after that switch
    # this topic delivers NO history to a late-joining scada_web. The catalogue must
    # be requested: write ValueRequest{command=METADATA, uid=<all-sentinel>} and
    # retry until the uid->metadata map is populated. Subscribing and waiting will
    # hang forever with an empty catalogue. Values need no equivalent — they are
    # periodic, so a late joiner waits at most one publish period.

  - name: "PLC::IdValue"
    participant: plc_domain
    type: "PLC::IdValue"
    qos_profile: "web::idvalue"
    # Periodic value stream. No filter — the selector (when built) will
    # pre-filter; for the PoC we receive everything.

# --- View mappings ---
# Project the wire DynamicData type down to a slim JSON view for web clients.
# The mapping engine handles union projection, char-array→string, renaming.
views:
  - name: tag_value
    topic: "PLC::IdValue"
    fields:
      - wire: uid
        view: uid
      - wire: valueTime
        view: timestamp
      - wire: smoothedValue
        view: value
        transform: union_scalar  # resolve Value_t union → bare scalar
      - wire: rawValue
        view: raw_value
        transform: union_scalar

  - name: tag_metadata
    topic: "PLC::MetaData"
    fields:
      - wire: uid
        view: uid
      - wire: longName
        view: name
      - wire: hostname
        view: source
      - wire: limits.redHigh
        view: alarm_hh
        transform: union_scalar
      - wire: limits.redLow
        view: alarm_ll
        transform: union_scalar
      - wire: limits.yellowHigh
        view: alarm_h
        transform: union_scalar
      - wire: limits.yellowLow
        view: alarm_l
        transform: union_scalar

# --- Web server ---
server:
  host: "0.0.0.0"
  port: 8080
  websocket_path: /ws
  rest_prefix: /api/v1

# scada_web configuration
#
# Declares DDS participants and topic subscriptions for the pre-selector PoC.
# Target topology moves this gateway to domain 16 (presentation) and selected topics only.
# Pattern: references/act-sim-scope-infra/router/config/control-platform.yaml

# --- XML type library ---
# Generated with: rtiddsgen -convertToXml dds/idl/PlcValue.idl -d dds/idl/
types:
  xml: dds/idl/PlcValue.xml

# --- QoS profiles ---
# Shared profiles grouped by DDS domain: field and presentation.
qos_profiles: dds/qos/profiles.xml

# --- Selection defaults ---
# Initial global minimum separation for web-originated ADD requests. The selector
# also has this value in its own YAML; browser/UI changes override it at runtime
# by sending period_ms/min_separation_ms.
selection:
  default_min_separation_ms: 250

# --- RTI Web Integration Service compatibility ---
# scada_web serves the WIS REST/WebSocket URIs so UI/index.html — written
# against WIS 7.7 — runs unchanged. These names appear in the resource URIs and
# must match what the browser is configured with; they mirror wis-config.xml.
#
#   /dds/rest1/applications/ScadaWebApp/domain_participants/Plant
#       /subscribers/IdValueSubscriber/data_readers/IdValueReader
#
# strict_websocket_connections: false accepts a socket whose connection name was
# never POSTed to /dds/v1/websocket_connections. WIS requires the reservation;
# set true to match it exactly.
wis:
  enabled: true
  application: ScadaWebApp
  strict_websocket_connections: false
  document_root: UI          # serve the browser UI, like WIS -documentRoot
  allow_origins: ["*"]       # WIS defaults -accessControlAllowOrigin to '*'

# --- DDS participants ---
# Domain IDs are defined in dds/idl/PlcValue.idl (PLC::FIELD_DOMAIN_ID = 15,
# PLC::PRESENTATION_DOMAIN_ID = 16).
#
# NOTE (DD-028): this is the FIELD domain, which the boundary decision says
# scada_web must not touch. It reads the field domain only because the selector
# does not exist yet and this is what WIS does today — it is the direct
# replacement path. When scada_select lands, this becomes domain 16 with the
# selected topics below.
#
# wis_name is the participant name carried in WIS URIs ("Plant" in
# wis-config.xml), which is independent of this config's participant key.
participants:
  plc_domain:
    domain: 15  # WIS participant uses DDS domain 15

# --- Topic subscriptions ---
# Topic name defaults to type name if type: is omitted. Names here are the DDS
# topic names the sim publishes (PLC::MetaDataTopic / PLC::IdValueTopic per
# dds/idl/PlcValue.idl), NOT the type names.
topics:
  - name: "PLC::MetaDataTopic"
    participant: plc_domain
    type: "PLC::MetaData"
    qos_profile: "field::metadata"
    wis:
      subscriber: MetaDataSubscriber
      data_reader: MetaDataReader
    # MetaData is TRANSIENT_LOCAL — we'll receive all tags even as a late joiner.
    #
    # NOTE (DD-028): when the selector lands this becomes:
    #     - name: "PLC::SelectedMetaDataTopic"
    #       participant: web_domain
    # and scada_web loses its field-side participant entirely. Same for
    # PLC::IdValueTopic → PLC::SelectedValueTopic below.
    #
    # NOTE: metadata streams are TRANSIENT_LOCAL on both field and presentation
    # domains, so late-joining readers receive the latest catalogue sample per uid.
    # Values need no equivalent — they are periodic, so a late joiner waits at
    # most one publish period.

  - name: "PLC::IdValueTopic"
    participant: plc_domain
    type: "PLC::IdValue"
    qos_profile: "field::idvalue"
    wis:
      subscriber: IdValueSubscriber
      data_reader: IdValueReader
    # Periodic value stream. No filter — the selector (when built) will
    # pre-filter; for the PoC we receive everything.

# --- Published topics ---
# The back-channel the browser writes selection commands to. Nothing consumes it
# until scada_select exists; writing is still accepted, exactly as with WIS.
writers:
  - name: "PLC::ValueRequestTopic"
    participant: plc_domain
    type: "PLC::ValueRequest"
    qos_profile: "presentation::value_request"
    wis:
      publisher: ControlPublisher
      data_writer: ValueRequestWriter

# --- Historical view mappings ---
# DD-052/DD-053 supersede config-driven mapping for the typed SCADA gateway.
# View mappings now live in scada_web/views.py. This section remains only as
# legacy PoC input until config.py stops accepting it.
views:
  - name: tag_value
    topic: "PLC::IdValueTopic"
    fields:
      - wire: uid
        view: uid
      - wire: valueTime
        view: timestamp
      - wire: smoothedValue
        view: value
        transform: union_scalar  # resolve Value_t union → bare scalar
      - wire: rawValue
        view: raw_value
        transform: union_scalar

  - name: tag_metadata
    topic: "PLC::MetaDataTopic"
    fields:
      - wire: uid
        view: uid
      - wire: longName
        view: name
      - wire: hostname
        view: source
      - wire: limits.redHigh
        view: alarm_hh
        transform: union_scalar
      - wire: limits.redLow
        view: alarm_ll
        transform: union_scalar
      - wire: limits.yellowHigh
        view: alarm_h
        transform: union_scalar
      - wire: limits.yellowLow
        view: alarm_l
        transform: union_scalar

# --- Web server ---
server:
  host: "0.0.0.0"
  port: 8080
  websocket_path: /ws
  rest_prefix: /api/v1

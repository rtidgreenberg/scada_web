# scada_web configuration
#
# Declares DDS participants and topic subscriptions for the pre-selector PoC.
# Target topology moves this gateway to domain 16 (presentation) and selected topics only.
# Pattern: references/act-sim-scope-infra/router/config/control-platform.yaml

# --- XML type library ---
# Generated with: rtiddsgen -convertToXml dds/idl/PlcValue.idl -d dds/idl/
types:
  xml: dds/idl/PlcValue.xml

# --- QoS profiles ---
# Shared profiles grouped by DDS domain: field and presentation.
qos_profiles: dds/qos/profiles.xml

# --- Selection defaults ---
# Initial global minimum separation for web-originated ADD requests. The selector
# also has this value in its own YAML; browser/UI changes override it at runtime
# by sending period_ms/min_separation_ms.
#
# Must be > 0. On the ValueRequest contract (dds/idl/PlcValue.idl) a PERIOD
# command with period_ms == 0 tells the selector to restore ITS configured
# default -- it does not request the full field rate, and the web side cannot
# request that at all.
selection:
  default_min_separation_ms: 250

# --- Static UI ---
# Directory served at "/" via the native API's FastAPI app (mounted last so it
# cannot shadow /api/v1 or /ws).
document_root: UI

# --- DDS participants ---
# Domain IDs are defined in dds/idl/PlcValue.idl (PLC::FIELD_DOMAIN_ID = 15,
# PLC::PRESENTATION_DOMAIN_ID = 16).
#
# NOTE (DD-028): scada_select now exists, so scada_web reads only the
# presentation domain and its selected topics below -- it no longer touches
# the field domain directly.
participants:
  web_domain:
    domain: 16  # PLC::PRESENTATION_DOMAIN_ID

# --- Topic subscriptions ---
# Topic name defaults to type name if type: is omitted. Names here are the DDS
# topic names the sim publishes (PLC::MetaDataTopic / PLC::IdValueTopic per
# dds/idl/PlcValue.idl), NOT the type names.
topics:
  - name: "PLC::SelectedMetaDataTopic"
    participant: web_domain
    type: "PLC::MetaData"
    qos_profile: "presentation::selected_metadata"
    # MetaData is TRANSIENT_LOCAL — we'll receive all tags even as a late joiner.
    #
    # NOTE: metadata streams are TRANSIENT_LOCAL on both field and presentation
    # domains, so late-joining readers receive the latest catalogue sample per uid.
    # Values need no equivalent — they are periodic, so a late joiner waits at
    # most one publish period.

  - name: "PLC::SelectedValueTopic"
    participant: web_domain
    type: "PLC::IdValue"
    qos_profile: "presentation::selected_value"
    # Periodic value stream, pre-filtered by scada_select -- only selected uids
    # reach this topic.

# --- Published topics ---
# The back-channel the browser writes selection commands to, consumed by
# scada_select's ControlPlane on the presentation domain.
writers:
  - name: "PLC::ValueRequestTopic"
    participant: web_domain
    type: "PLC::ValueRequest"
    qos_profile: "presentation::value_request"

# --- Historical view mappings ---
# DD-052/DD-053 supersede config-driven mapping for the typed SCADA gateway.
# View mappings now live in scada_web/views.py. This section remains only as
# legacy PoC input until config.py stops accepting it.
views:
  - name: tag_value
    topic: "PLC::SelectedValueTopic"
    fields:
      - wire: uid
        view: uid
      - wire: valueTime
        view: timestamp
      - wire: smoothedValue
        view: value
        transform: union_scalar  # resolve Value_t union → bare scalar

# --- Server binding ---
server:
  host: "127.0.0.1"
  port: 8080
      - wire: rawValue
        view: raw_value
        transform: union_scalar

  - name: tag_metadata
    topic: "PLC::SelectedMetaDataTopic"
    fields:
      - wire: uid
        view: uid
      - wire: longName
        view: name
      - wire: hostname
        view: source
      - wire: limits.redHigh
        view: alarm_hh
        transform: union_scalar
      - wire: limits.redLow
        view: alarm_ll
        transform: union_scalar
      - wire: limits.yellowHigh
        view: alarm_h
        transform: union_scalar
      - wire: limits.yellowLow
        view: alarm_l
        transform: union_scalar

# --- Web server ---
server:
  host: "0.0.0.0"
  port: 8080
  websocket_path: /ws
  rest_prefix: /api/v1

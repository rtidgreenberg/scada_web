# scada-selector configuration
#
# Fixed DDS topology is controlled by domain/topic names and shared QoS profiles.
# Domain IDs are defined in dds/idl/PlcValue.idl:
#   PLC::FIELD_DOMAIN_ID = 15
#   PLC::PRESENTATION_DOMAIN_ID = 16
# Selection defaults are loaded at startup; the PERIOD command (ValueRequest union)
# overrides the global minimum separation at runtime.

qos_profiles: ../dds/qos/profiles.xml

selection:
  # Default minimum time between forwarded SelectedValue samples for one uid.
  # The PERIOD command overrides this at runtime when period_ms is nonzero.
  # Set to 0 to forward every selected field sample by default.
  default_min_separation_ms: 250
  # Phase 1 PoC uid range pre-enabled at startup (DD-039). No catalogue
  # bootstrap or dynamic ADD is required for the range to be forwarded;
  # ValueRequest ADD/DELETE can still narrow or widen it at runtime.
  uid_range_low: 100
  uid_range_high: 500

topics:
  idvalue: "PLC::IdValueTopic"
  metadata: "PLC::MetaDataTopic"
  selected_value: "PLC::SelectedValueTopic"
  selected_metadata: "PLC::SelectedMetaDataTopic"
  value_request: "PLC::ValueRequestTopic"

